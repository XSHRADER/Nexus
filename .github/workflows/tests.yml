name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.10
      - run: ruff check .

  test:
    # Windows is where NEXUS runs (and what the PC tools target); Linux keeps
    # it honest about paths and line endings.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The embedding, reranker and NLI models are downloaded on first use.
      # Cache them so only the first run pays for it.
      - name: Cache sentence-transformers models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-ms-marco-nli-deberta-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No Ollama on the runner, and none is needed: the tests fake the model
      # server and exercise routing, retrieval, indexing, the UIs and storage.
      - name: Run tests
        run: python -m unittest discover -s tests -v
