name: train-router

# Manual only: trains the learned router on the seed data plus the public
# Arena preference votes (lmarena-ai/arena-human-preference-55k), prints the
# measured results, and uploads the trained router as an artifact you can
# drop into models/ on your PC.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Use at most this many public battles (blank = all)"
        required: false
        default: ""
      embeddings:
        description: "Add MiniLM embeddings to the features (on / off)"
        required: false
        default: "on"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache Hugging Face models and datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-train-router-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt datasets

      - name: Train and measure
        run: |
          args="--arena55k --embeddings ${{ inputs.embeddings || 'on' }}"
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          python train/train_router.py $args
          python -m nexus.evaluate_learned_router

      - name: Upload trained router
        uses: actions/upload-artifact@v4
        with:
          name: nexus-router
          path: |
            models/
            train/data/arena55k_strong.info.json
