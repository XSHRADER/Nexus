# Cloud models NEXUS can route to when cloud is switched on.
#
# Providers rename and retire models often, so names live here rather than in
# code. The Diagnostics tab has a "Check model names" button that asks each
# provider (whose key is set) which models it serves and flags any name below
# that no longer exists. To change or add models without editing this file,
# add [[cloud.models]] entries to nexus.toml: an entry with the same `name`
# replaces the one here.
#
# Fields
#   name        exact model ID the provider expects
#   provider    gemini | groq | openrouter | deepseek | mistral
#   cost        free  - the provider has a free tier
#               cheap - billed per token, low price
#               paid  - billed per token; only used when allow_paid = true
#   modalities  what it accepts: "text", "image"
#   quality     0..1, capability on hard prompts
#   speed       0..1, responsiveness
#   context     context window in tokens
#   strengths   task -> 0..1 fit; a task left out means "never route it here"
#
# Scores are on the same scale as the local models in providers.py, so local
# and cloud models compete on one table.

[[model]]
name = "gemini-3.7-flash"
provider = "gemini"
cost = "free"
modalities = ["text", "image"]
quality = 0.84
speed = 0.86
context = 1000000
note = "fast all-rounder, reads images, very long context"
strengths = { general = 0.90, coding = 0.82, reasoning = 0.84, planning = 0.84, vision = 0.92 }

