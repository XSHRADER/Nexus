<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <style>
      /* Same palette as the Streamlit theme in .streamlit/config.toml. */
      :root {
        --bg: #0e1016;
        --surface: #171a23;
        --surface-2: #1b1f2a;
        --line: #2a2f3d;
        --text: #e4e7ef;
        --muted: #8a93a6;
        --accent: #5b5bd6;
        --link: #9aa5ff;
        --green: #3fb27f;
        --red: #e5636b;
        --orange: #e0a03d;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 15px;
        background: var(--bg);
        color: var(--text);
      }
      .layout {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .brand { font-size: 1.3rem; font-weight: 650; letter-spacing: .02em; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: .8rem;
        background: var(--surface-2);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.on { background: var(--green); }
      .dot.off { background: var(--red); }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 4px 2px 16px;
      }
      .msg {
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: var(--radius);
        line-height: 1.55;
        max-width: 85%;
        overflow-wrap: anywhere;
      }
      .msg.user { margin-left: auto; background: var(--surface-2); border: 1px solid var(--line); }
      .msg.assistant { background: var(--surface); border: 1px solid var(--line); }
      .msg.error { border-color: var(--red); }
      .meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
      .sources { margin-top: 8px; color: var(--muted); font-size: .85rem; }
      .sources summary { cursor: pointer; }
      .sources li { margin: 4px 0; }
      .composer {
        display: flex;
        gap: 10px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 48px;
        max-height: 150px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }
      textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        padding: 8px 16px;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .6; cursor: progress; }
      .actions { margin-top: 10px; display: flex; gap: 8px; }
      .hint { color: var(--muted); font-size: .8rem; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <header>
        <div class="brand">NEXUS</div>
        <span class="pill" id="status"><span class="dot"></span>Checking Ollama…</span>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div>
        <div class="composer">
          <textarea id="question" placeholder="Ask about your documents — or anything else"></textarea>
          <button id="sendBtn" class="primary">Send</button>
        </div>
        <div class="hint">Enter to send · Shift+Enter for a new line · runs entirely on this PC</div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('question');
      const sendBtn = document.getElementById('sendBtn');

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function el(tag, className, html) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (html !== undefined) node.innerHTML = html;
        return node;
      }

      fetch('/api/status').then(r => r.json()).then(s => {
        const up = s.ollama && s.ollama.length;
        const status = document.getElementById('status');
        status.innerHTML = '<span class="dot ' + (up ? 'on' : 'off') + '"></span>' +
          (up ? 'Ollama · ' + s.ollama.length + ' models' : 'Ollama offline — run ollama serve') +
          (s.loaded && s.loaded.length ? ' · in memory: ' + escapeHtml(s.loaded.join(', ')) : '');
      }).catch(() => {});

      function appendMessage(role, text, extraClass) {
        const row = el('div', 'msg ' + role + (extraClass ? ' ' + extraClass : ''),
                       '<div>' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>');
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return row;
      }

      function addMeta(row, data) {
        const items = [data.model || 'no model', data.task || '?'];
        if (data.sources && data.sources.length) items.push(data.sources.length + ' sources');
        if (data.elapsed) items.push(Number(data.elapsed).toFixed(1) + ' s');
        row.appendChild(el('div', 'meta', items.map(i => '<span class="pill">' + escapeHtml(i) + '</span>').join('')));
        if (data.sources && data.sources.length) {
          const list = data.sources.map((s, i) =>
            '<li><b>[' + (i + 1) + ']</b> ' + escapeHtml(s.source) + ' — ' +
            escapeHtml((s.text || '').replace(/\s+/g, ' ').slice(0, 200)) + '…</li>').join('');
          row.appendChild(el('details', 'sources', '<summary>Sources</summary><ol style="list-style:none;padding-left:0">' + list + '</ol>'));
        }
        if (data.info) row.appendChild(el('div', 'hint', escapeHtml(data.info)));
      }

      function addConfirmation(row, pendingId) {
        const actions = el('div', 'actions');
        const apply = el('button', 'primary', 'Apply changes');
        const cancel = el('button', '', 'Cancel');
        apply.addEventListener('click', () => {
          apply.disabled = cancel.disabled = true;
          apply.textContent = 'Applying…';
          fetch('/api/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pending_id: pendingId })
          })
          .then(async (res) => {
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Request failed');
            appendMessage('assistant', data.answer || 'Done.');
          })
          .catch((err) => appendMessage('assistant', 'Could not apply: ' + err.message, 'error'))
          .finally(() => actions.remove());
        });
        cancel.addEventListener('click', () => {
          actions.remove();
          appendMessage('assistant', 'Cancelled — nothing on disk changed.');
        });
        actions.append(apply, cancel);
        row.appendChild(actions);
      }

      function send(question) {
        if (!question) return;
        appendMessage('user', question);
        inputEl.value = '';
        sendBtn.disabled = true;
        sendBtn.textContent = 'Thinking…';

        fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        })
        .then(async (res) => {
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Request failed');
          const row = appendMessage('assistant', data.answer || 'No answer returned.');
          addMeta(row, data);
          if (data.requires_confirmation && data.pending_id) addConfirmation(row, data.pending_id);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        })
        .catch((err) => appendMessage('assistant', 'NEXUS could not answer: ' + err.message, 'error'))
        .finally(() => {
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send';
          inputEl.focus();
        });
      }

      sendBtn.addEventListener('click', () => send(inputEl.value.trim()));
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          send(inputEl.value.trim());
        }
      });

      appendMessage('assistant', 'Ask about your documents, a coding problem, a decision — or ask me to tidy a folder. Everything runs on this PC.');
    </script>
  </body>
</html>
