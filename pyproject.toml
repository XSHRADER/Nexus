[project]
name = "nexus-ai"
version = "1.0.0"
description = "Local-first private assistant: answers from your files with local Ollama models, shows its work, and checks itself. Cloud models optional."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Runtime pins live in requirements.txt (exact, tested versions).

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["nexus-env", "vector_store", "data", ".playwright-mcp"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = [
    "E501",    # long strings and URLs read better unwrapped; the formatter-free limit is 110
    "SIM108",  # ternaries are not always clearer
    "B905",    # zip(strict=) everywhere is noise for same-length literals
    "SIM105",  # try/except/pass reads fine
    "SIM112",  # Windows env vars are mixed-case (OneDrive, SystemRoot)
]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]
# Test helpers sort with third-party imports, i.e. before any `nexus` import.
known-third-party = ["fakes", "isolate"]

[tool.ruff.lint.per-file-ignores]
# Test modules set environment variables before importing NEXUS.
"tests/*" = ["E402"]
