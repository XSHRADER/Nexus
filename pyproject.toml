[project]
name = "nexus-ai"
version = "0.3.0"
description = "Local, private document assistant: hybrid retrieval over your files, answered by local Ollama models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Runtime pins live in requirements.txt (exact, tested versions).

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["nexus-env", "vector_store", "data", ".playwright-mcp"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = [
    "E501",    # long strings and URLs read better unwrapped; the formatter-free limit is 110
    "SIM108",  # ternaries are not always clearer
    "B905",    # zip(strict=) everywhere is noise for same-length literals
    "SIM105",  # try/except/pass reads fine
    "SIM112",  # Windows env vars are mixed-case (OneDrive, SystemRoot)
]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]
known-third-party = ["fakes"]

[tool.ruff.lint.per-file-ignores]
# Test modules set environment variables before importing NEXUS.
"tests/*" = ["E402"]
