<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS AI</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2e;
        --panel-2: #1a2440;
        --line: #2b3a5d;
        --text: #edf2ff;
        --muted: #9aa8c7;
        --accent: #67e8f9;
        --accent-2: #a78bfa;
        --success: #34d399;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Segoe UI, sans-serif;
        background: linear-gradient(180deg, #0b1020, #111827 35%, #0f172a);
        color: var(--text);
      }
      .layout {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .brand { font-size: 2rem; font-weight: 700; }
      .brand span { color: var(--accent); }
      .chat-shell {
        background: rgba(18, 26, 46, 0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }
      .messages {
        min-height: 420px;
        max-height: 54vh;
        overflow-y: auto;
        padding: 18px;
        background: rgba(10, 13, 23, 0.78);
      }
      .msg {
        margin-bottom: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        line-height: 1.55;
        max-width: 80%;
      }
      .msg.user {
        margin-left: auto;
        background: linear-gradient(135deg, var(--accent-2), #4f46e5);
      }
      .msg.assistant {
        background: var(--panel-2);
        border: 1px solid var(--line);
      }
      .composer {
        display: flex;
        gap: 12px;
        padding: 18px;
        border-top: 1px solid var(--line);
        background: rgba(18, 26, 46, 0.95);
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 52px;
        max-height: 150px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #0f172a;
        color: var(--text);
        padding: 14px 16px;
        font: inherit;
      }
      button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #08111d;
        font-weight: 700;
        padding: 0 20px;
        cursor: pointer;
      }
      .meta {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .badge {
        background: rgba(103, 232, 249, 0.12);
        border: 1px solid rgba(103, 232, 249, 0.25);
        border-radius: 999px;
        padding: 4px 10px;
      }
      .error {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="topbar">
        <div class="brand">NEXUS <span>AI</span></div>
        <div class="badge" id="statusBadge">Auto-selects the best AI</div>
      </div>

      <div class="chat-shell">
        <div id="messages" class="messages"></div>
        <div class="composer">
          <textarea id="question" placeholder="Ask about a coding fix, project docs, or a reasoning task..."></textarea>
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('question');
      const sendBtn = document.getElementById('sendBtn');

      // Show which backends are reachable so an "unavailable" answer makes sense.
      fetch('/api/status').then(r => r.json()).then(s => {
        const parts = [];
        parts.push(s.ollama && s.ollama.length ? 'Local: ' + s.ollama.length + ' model(s)' : 'Local: offline');
        if (s.loaded && s.loaded.length) parts.push('In VRAM: ' + s.loaded.join(', '));
        document.getElementById('statusBadge').textContent = 'Auto-selects local AI · ' + parts.join(' · ');
      }).catch(() => {});

      function appendMessage(role, text, meta = null) {
        const row = document.createElement('div');
        row.className = 'msg ' + role;
        row.innerHTML = '<div>' + text.replace(/\n/g, '<br>') + '</div>';
        if (meta) {
          const metaRow = document.createElement('div');
          metaRow.className = 'meta';
          metaRow.innerHTML = meta.map(item => '<span class="badge">' + item + '</span>').join('');
          row.appendChild(metaRow);
        }
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function send(question, confirm) {
        if (!question) return;
        if (!confirm) {
          appendMessage('user', question);
          inputEl.value = '';
        }
        sendBtn.disabled = true;
        sendBtn.textContent = 'Thinking...';

        fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, confirm: !!confirm })
        })
        .then(async (res) => {
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Request failed');
          // Auto-picked, never chosen by the user — show what answered and why.
          const meta = [
            'Task: ' + (data.task || 'unknown'),
            'Auto-picked: ' + (data.model || 'none') +
              (data.provider === 'ollama' ? ' (local)' : ''),
            'Difficulty: ' + Number(data.complexity || 0).toFixed(2),
            'RAG: ' + (data.needs_rag ? 'on' : 'off')
          ];
          if (data.why) meta.push(data.why);
          appendMessage('assistant', data.answer || 'No answer returned.', meta);
          if (data.info) appendMessage('assistant', 'ℹ️ ' + data.info, null);
          if (data.requires_confirmation) {
            const applyBtn = document.createElement('button');
            applyBtn.textContent = 'Apply changes';
            applyBtn.style.marginTop = '10px';
            applyBtn.addEventListener('click', () => {
              applyBtn.disabled = true;
              applyBtn.textContent = 'Applying...';
              send(question, true);
            });
            messagesEl.lastChild.appendChild(applyBtn);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        })
        .catch((err) => {
          appendMessage('assistant', 'NEXUS could not answer: ' + err.message, null);
        })
        .finally(() => {
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send';
        });
      }

      function ask() {
        send(inputEl.value.trim(), false);
      }

      sendBtn.addEventListener('click', ask);
      inputEl.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
          ask();
        }
      });

      appendMessage('assistant', 'Welcome to NEXUS AI. Ask me about your project, a coding issue, a design decision, or your local documents.');
    </script>
  </body>
</html>
